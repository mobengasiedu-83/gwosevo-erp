<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Leave request approval path</title>
  <desc id="desc">An employee submits a leave request. The supervisor reviews it first. Approved requests proceed to HR for final review. Rejected requests return with the decision recorded.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f5fa"/><stop offset="1" stop-color="#f4f8f2"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#a295ad"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#302d33}.head{font-size:23px;font-weight:750}.sub{font-size:13px;fill:#786f7e}.step{font-size:15px;font-weight:700}.note{font-size:12px;fill:#786f7e}.tag{font-size:11px;font-weight:750;fill:#685478}</style></defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/><text x="32" y="43" class="head">Leave approval path</text><text x="32" y="66" class="sub">Two reviews, with the supervisor first and HR making the final decision.</text>
  <g fill="none" stroke="#a295ad" stroke-width="2" marker-end="url(#arrow)"><path d="M245 166h60"/><path d="M495 166h60"/><path d="M745 166h60"/><path d="M995 166h60"/></g>
  <g transform="translate(32 111)"><rect width="213" height="112" rx="16" fill="#fff" stroke="#e5dfea"/><circle cx="28" cy="29" r="15" fill="#f1eaf6"/><text x="28" y="33" text-anchor="middle" class="tag">1</text><text x="20" y="67" class="step">Employee submits</text><text x="20" y="91" class="note">Dates, leave type</text><text x="20" y="107" class="note">and supporting details</text></g>
  <g transform="translate(305 111)"><rect width="190" height="112" rx="16" fill="#fff" stroke="#e5dfea"/><circle cx="28" cy="29" r="15" fill="#f1eaf6"/><text x="28" y="33" text-anchor="middle" class="tag">2</text><text x="20" y="67" class="step">Supervisor review</text><text x="20" y="91" class="note">Approve or return</text><text x="20" y="107" class="note">with a recorded reason</text></g>
  <g transform="translate(555 111)"><rect width="190" height="112" rx="16" fill="#fff" stroke="#e5dfea"/><circle cx="28" cy="29" r="15" fill="#f1eaf6"/><text x="28" y="33" text-anchor="middle" class="tag">3</text><text x="20" y="67" class="step">HR final review</text><text x="20" y="91" class="note">Reviews requests</text><text x="20" y="107" class="note">approved by supervisor</text></g>
  <g transform="translate(805 111)"><rect width="190" height="112" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="28" cy="29" r="15" fill="#eaf4e5"/><text x="28" y="33" text-anchor="middle" class="tag">4</text><text x="20" y="67" class="step">Decision recorded</text><text x="20" y="91" class="note">Employee and approvers</text><text x="20" y="107" class="note">can review the outcome</text></g>
  <g transform="translate(1055 111)"><rect width="113" height="112" rx="16" fill="#fff" stroke="#dfe8da"/><text x="17" y="49" class="step">Balance</text><text x="17" y="73" class="note">updated after</text><text x="17" y="91" class="note">final approval</text></g>
  <path d="M400 225v48h20" fill="none" stroke="#c6857c" stroke-width="2"/><circle cx="422" cy="273" r="4" fill="#c6857c"/><text x="439" y="278" class="note">If supervisor declines, the request ends with a recorded decision.</text>
</svg>
