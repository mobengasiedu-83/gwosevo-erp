<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">GWO SEVO ERP module map</title>
  <desc id="desc">The eleven main menu areas arranged into daily work, customer and commercial work, delivery and people operations, and platform support.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f9f3"/><stop offset="1" stop-color="#f4f2f7"/></linearGradient>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2c2930}.title{font-size:25px;font-weight:750}.sub{font-size:14px;fill:#766d7e}.group{font-size:13px;font-weight:750;letter-spacing:1px;fill:#54764a}.item{font-size:15px;font-weight:650}.num{font-size:11px;font-weight:800;fill:#397d32}.hint{font-size:12px;fill:#827a87}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="36" y="52" class="title">A map of the workspace</text>
  <text x="36" y="78" class="sub">Open a menu area from the sidebar; access and visible records depend on your permissions and organization.</text>
  <g transform="translate(28 112)">
    <rect width="270" height="365" rx="17" fill="#fff" stroke="#e5e9e3"/><rect width="270" height="8" rx="4" fill="#80ae70"/>
    <text x="22" y="43" class="group">DAILY WORK</text>
    <g transform="translate(20 67)"><circle cx="16" cy="15" r="15" fill="#eef6e9"/><text x="16" y="19" text-anchor="middle" class="num">01</text><text x="43" y="20" class="item">Workspace</text></g>
    <g transform="translate(20 119)"><circle cx="16" cy="15" r="15" fill="#eef6e9"/><text x="16" y="19" text-anchor="middle" class="num">02</text><text x="43" y="20" class="item">CRM &amp; Customer Management</text></g>
    <g transform="translate(20 171)"><circle cx="16" cy="15" r="15" fill="#eef6e9"/><text x="16" y="19" text-anchor="middle" class="num">03</text><text x="43" y="20" class="item">Social Media Management</text></g>
    <text x="22" y="254" class="hint">Personal tasks, prospects</text><text x="22" y="274" class="hint">and social planning</text>
  </g>
  <g transform="translate(312 112)">
    <rect width="270" height="365" rx="17" fill="#fff" stroke="#e5e9e3"/><rect width="270" height="8" rx="4" fill="#83a9cb"/>
    <text x="22" y="43" class="group" style="fill:#537a9d">CUSTOMERS &amp; SALES</text>
    <g transform="translate(20 67)"><circle cx="16" cy="15" r="15" fill="#edf4fa"/><text x="16" y="19" text-anchor="middle" style="fill:#537a9d" class="num">04</text><text x="43" y="20" class="item">Commercial &amp; Sales</text></g>
    <g transform="translate(20 119)"><circle cx="16" cy="15" r="15" fill="#edf4fa"/><text x="16" y="19" text-anchor="middle" style="fill:#537a9d" class="num">05</text><text x="43" y="20" class="item">Customer Experience</text></g>
    <text x="22" y="254" class="hint">Opportunities, finance,</text><text x="22" y="274" class="hint">service and support</text>
  </g>
  <g transform="translate(596 112)">
    <rect width="270" height="365" rx="17" fill="#fff" stroke="#e5e9e3"/><rect width="270" height="8" rx="4" fill="#d4ad58"/>
    <text x="22" y="43" class="group" style="fill:#94752d">PEOPLE &amp; DELIVERY</text>
    <g transform="translate(20 67)"><circle cx="16" cy="15" r="15" fill="#faf4e7"/><text x="16" y="19" text-anchor="middle" style="fill:#94752d" class="num">06</text><text x="43" y="20" class="item">Human Resources</text></g>
    <g transform="translate(20 119)"><circle cx="16" cy="15" r="15" fill="#faf4e7"/><text x="16" y="19" text-anchor="middle" style="fill:#94752d" class="num">07</text><text x="43" y="20" class="item">Operations &amp; Projects</text></g>
    <g transform="translate(20 171)"><circle cx="16" cy="15" r="15" fill="#faf4e7"/><text x="16" y="19" text-anchor="middle" style="fill:#94752d" class="num">08</text><text x="43" y="20" class="item">Procurement &amp; Assets</text></g>
    <text x="22" y="254" class="hint">Staffing, work delivery</text><text x="22" y="274" class="hint">and resources</text>
  </g>
  <g transform="translate(880 112)">
    <rect width="292" height="365" rx="17" fill="#fff" stroke="#e5e9e3"/><rect width="292" height="8" rx="4" fill="#b099c4"/>
    <text x="22" y="43" class="group" style="fill:#7d668f">INSIGHT &amp; CONTROL</text>
    <g transform="translate(20 67)"><circle cx="16" cy="15" r="15" fill="#f4eff7"/><text x="16" y="19" text-anchor="middle" style="fill:#7d668f" class="num">09</text><text x="43" y="20" class="item">Finance</text></g>
    <g transform="translate(20 119)"><circle cx="16" cy="15" r="15" fill="#f4eff7"/><text x="16" y="19" text-anchor="middle" style="fill:#7d668f" class="num">10</text><text x="43" y="20" class="item">Knowledge &amp; Intelligence</text></g>
    <g transform="translate(20 171)"><circle cx="16" cy="15" r="15" fill="#f4eff7"/><text x="16" y="19" text-anchor="middle" style="fill:#7d668f" class="num">11</text><text x="43" y="20" class="item">Administration</text></g>
    <text x="22" y="254" class="hint">Records, reporting</text><text x="22" y="274" class="hint">and platform settings</text>
  </g>
  <text x="36" y="526" class="hint">Menu numbering follows the supplied top-level menu specification.</text>
</svg>
