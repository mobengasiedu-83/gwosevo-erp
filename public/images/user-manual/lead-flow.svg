<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Lead to customer workflow</title>
  <desc id="desc">A lead is captured, reviewed and qualified, assigned and followed up, then converted into an account, contact and opportunity or closed with an outcome.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f9f2"/><stop offset="1" stop-color="#f3f5f8"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#91a48b"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#302d33}.head{font-size:23px;font-weight:750}.sub{font-size:13px;fill:#786f7e}.step{font-size:15px;font-weight:700}.note{font-size:12px;fill:#786f7e}.badge{font-size:11px;font-weight:800;fill:#397d32}</style></defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/><text x="32" y="43" class="head">Lead journey</text><text x="32" y="66" class="sub">Capture and qualification lead to a clear next action.</text>
  <g fill="none" stroke="#91a48b" stroke-width="2" marker-end="url(#arrow)"><path d="M220 161h35"/><path d="M448 161h35"/><path d="M676 161h35"/><path d="M904 161h35"/></g>
  <g transform="translate(28 94)"><rect width="192" height="132" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="29" cy="30" r="16" fill="#eaf4e5"/><text x="29" y="34" text-anchor="middle" class="badge">1</text><text x="20" y="72" class="step">Capture</text><text x="20" y="98" class="note">Manual, website,</text><text x="20" y="116" class="note">API or approved import</text></g>
  <g transform="translate(256 94)"><rect width="192" height="132" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="29" cy="30" r="16" fill="#eaf4e5"/><text x="29" y="34" text-anchor="middle" class="badge">2</text><text x="20" y="72" class="step">Review &amp; qualify</text><text x="20" y="98" class="note">Check profile, duplicates</text><text x="20" y="116" class="note">and qualification</text></g>
  <g transform="translate(484 94)"><rect width="192" height="132" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="29" cy="30" r="16" fill="#eaf4e5"/><text x="29" y="34" text-anchor="middle" class="badge">3</text><text x="20" y="72" class="step">Assign &amp; follow up</text><text x="20" y="98" class="note">Set owner, record activity</text><text x="20" y="116" class="note">and schedule next step</text></g>
  <g transform="translate(712 94)"><rect width="192" height="132" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="29" cy="30" r="16" fill="#eaf4e5"/><text x="29" y="34" text-anchor="middle" class="badge">4</text><text x="20" y="72" class="step">Convert</text><text x="20" y="98" class="note">Create account, contact</text><text x="20" y="116" class="note">and opportunity</text></g>
  <g transform="translate(940 94)"><rect width="232" height="132" rx="16" fill="#fff" stroke="#dfe8da"/><circle cx="29" cy="30" r="16" fill="#eaf4e5"/><text x="29" y="34" text-anchor="middle" class="badge">5</text><text x="20" y="72" class="step">Track outcome</text><text x="20" y="98" class="note">Continue in pipeline or</text><text x="20" y="116" class="note">record a close outcome</text></g>
</svg>
